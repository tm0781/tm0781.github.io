<script>
let basket = document.getElementById("basket");

let score = 0;
let gameRunning = false;
let speed = 18;

/* HIGH SCORE */
let highscore = localStorage.getItem("highscore") || 0;

document.getElementById("highscore").innerText =
"High Score: " + highscore;

/* START */
function startGame() {
    document.getElementById("startScreen").style.display = "none";
    gameRunning = true;
}

/* RESTART */
function restartGame() {
    location.reload();
}

/* MOVE BASKET */
document.addEventListener("mousemove", e => {

    let x = e.clientX - 70;

    /* keep basket inside screen */
    if (x < 0) x = 0;

    if (x > window.innerWidth - 140) {
        x = window.innerWidth - 140;
    }

    basket.style.left = x + "px";
});

/* CREATE BLOCKS */
function createPart() {

    if (!gameRunning) return;

    let part = document.createElement("div");

    part.className =
        "part " + (Math.random() > 0.25 ? "good" : "bad");

    part.style.left =
        Math.random() * (window.innerWidth - 30) + "px";

    part.style.top = "-40px";

    document.body.appendChild(part);

    let fall = setInterval(() => {

        let top = part.offsetTop + 6;

        part.style.top = top + "px";

        /* collision */
        let basketLeft = basket.offsetLeft;
        let basketRight = basketLeft + basket.offsetWidth;

        let partLeft = part.offsetLeft;
        let partRight = partLeft + part.offsetWidth;

        let touching =
            partRight > basketLeft &&
            partLeft < basketRight &&
            top + 30 > window.innerHeight - 70;

        if (touching) {

            if (part.classList.contains("good")) {
                score += 10;
            } else {
                score -= 20;
                shakeScreen();
            }

            updateScore();

            clearInterval(fall);
            part.remove();
        }

        /* missed */
        if (top > window.innerHeight) {

            if (part.classList.contains("good")) {
                score -= 10;
            }

            updateScore();

            clearInterval(fall);
            part.remove();
        }

    }, speed);
}

/* UPDATE SCORE */
function updateScore() {

    document.getElementById("score").innerText =
        "Score: " + score;

    if (score > highscore) {

        highscore = score;

        localStorage.setItem("highscore", highscore);

        document.getElementById("highscore").innerText =
            "High Score: " + highscore;
    }

    if (score < -50) {

        gameRunning = false;

        document.getElementById("gameOver").style.display =
            "flex";
    }
}

/* SHAKE */
function shakeScreen() {

    document.body.style.transform = "translateX(8px)";

    setTimeout(() => {
        document.body.style.transform = "translateX(-8px)";
    }, 50);

    setTimeout(() => {
        document.body.style.transform = "translateX(0px)";
    }, 100);
}

/* SPAWN */
setInterval(createPart, 700);

/* HARD MODE */
setInterval(() => {

    if (gameRunning && speed > 8) {
        speed--;
    }

}, 5000);

/* RAINBOW TRAIL */
let trail = [];

for (let i = 0; i < 20; i++) {

    let dot = document.createElement("div");

    dot.className = "trail";

    document.body.appendChild(dot);

    trail.push({
        x: 0,
        y: 0,
        el: dot
    });
}

document.addEventListener("mousemove", e => {

    trail[0].x = e.clientX;
    trail[0].y = e.clientY;
});

function animateTrail() {

    for (let i = 0; i < trail.length; i++) {

        let current = trail[i];
        let next = trail[i - 1];

        if (i !== 0) {

            current.x +=
                (next.x - current.x) * 0.35;

            current.y +=
                (next.y - current.y) * 0.35;
        }

        current.el.style.left = current.x + "px";
        current.el.style.top = current.y + "px";

        current.el.style.background =
            `hsl(${i * 20}, 100%, 50%)`;

        current.el.style.opacity =
            1 - i / trail.length;
    }

    requestAnimationFrame(animateTrail);
}

animateTrail();
</script>
